  <!-- ============ 搜索 ============ -->
  <div class="tab-panel" id="panel-search">

    <!-- 2026-08-31：关键词搜索 Mod 和 按时间搜索 Mod 合并为一个卡片，共用 游戏选择/普通 NSFW 筛选 -->
    <!-- 2026-10-08：拆成**三种独立搜索通道**——按关键词 / 按角色（走角色分类抓取）/ 按时间，各自有独立按钮 -->
    <div class="card">
      <h2>搜索 Mod</h2>
      <p class="hint">三种独立搜索通道：<b>① 按关键词</b>（中文/角色名/别号，自动归一到英文）、<b>② 按角色</b>（直接抓该角色的香蕉网分类，全量不漏）、<b>③ 按时间</b>（新增/修改/更新任一命中）；共用下方游戏与分级筛选</p>
      <div class="row">
        <label>游戏
          <select id="searchGameSelect">
            <option value="">— 请选择游戏 —</option>
          </select>
        </label>
        <label><input type="checkbox" id="filterNormal" checked> 普通</label>
        <label><input type="checkbox" id="filterNsfw" checked> NSFW</label>
      </div>
      <div class="row mt">
        <label>① 按关键词 <input type="text" id="kwInput" placeholder="输入关键词" style="width:240px"></label>
        <button class="primary" id="kwSearchBtn" type="button">关键词搜索</button>
      </div>
      <div class="row mt">
        <div style="position:relative">
          <label>② 按角色 <input type="text" id="kwRoleInput" placeholder="输入过滤" style="width:150px" disabled autocomplete="off" title="从香蕉网获取该游戏角色列表；选中后按该角色的香蕉网分类抓取全部 mod"></label>
          <div class="combo-list" id="kwRoleCombo" style="display:none"></div>
        </div>
        <button class="primary" id="roleSearchBtn" type="button">按角色抓取</button>
      </div>
      <div class="row mt">
        <label>③ 按时间 <input type="date" id="searchStart"></label>
        <button class="ghost" id="earliestBtn" type="button" title="设为最早（2000-01-01，从第一个 mod 开始搜）">最早</button>
        <label>— <input type="date" id="searchEnd"></label>
        <button class="primary" id="searchBtn" type="button">按时间查询</button>
        <button class="ghost" id="stopSearchBtn" type="button" style="display:none">停止搜索</button>
      </div>
      <div class="status" id="kwStatus"></div>
      <div class="status" id="searchStatus"></div>
    </div>

    <div class="card">
      <h2>搜索结果 <span id="resultCount" class="sub"></span></h2>
      <div class="row" style="margin-bottom:8px">
        <button class="primary" id="selectAllBtn" type="button" title="只勾选符合上方「普通/NSFW 筛选」的结果">全选</button>
        <button class="ghost" id="selectNoneBtn" type="button">全不选</button>
        <button class="success" id="downloadSelectedBtn" type="button">下载勾选项</button>
        <button class="ghost" id="saveSearchBtn" type="button" title="把当前搜索结果覆盖写入 search_cache.json">保存</button>
        <button class="ghost" id="clearSearchBtn" type="button">清空列表</button>
        <button class="ghost" id="exportSearchBtn" type="button" title="导出当前搜索记录为 JSON 文件（备份/迁移用）">导出记录</button>
        <button class="ghost" id="importSearchBtn" type="button" title="上传 JSON 文件导入搜索记录（按 modId 合并，导入覆盖原有）">导入记录</button>
        <input type="file" id="importSearchFile" accept=".json,application/json" style="display:none">
      </div>
      <div class="result-list" id="searchResultList"><div class="empty">尚未搜索</div></div>
    </div>
  </div>
